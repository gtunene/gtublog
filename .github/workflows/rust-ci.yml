name: GTUBLOG Rust Axum CI & E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust_and_node_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Axum Unit Tests (cargo test)
        run: cargo test --verbose

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E Node Test Suite
        run: node --test tests/gtublog.test.mjs
